<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c10" />
    <title>一起听 · 多人一起听房间</title>
    <link rel="stylesheet" href="/listen_together_multi/css/tokens.css?v=88" />
    <link rel="stylesheet" href="/listen_together_multi/css/base.css?v=88" />
    <link rel="stylesheet" href="/listen_together_multi/css/layout.css?v=88" />
    <link rel="stylesheet" href="/listen_together_multi/css/player.css?v=88" />
    <link rel="stylesheet" href="/listen_together_multi/css/queue.css?v=88" />
    <link rel="stylesheet" href="/listen_together_multi/css/chat.css?v=88" />
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link
      rel="preload"
      as="script"
      href="/listen_together_multi/vendor/vue.global.prod.js?v=88"
    />
    <link
      rel="preload"
      as="script"
      href="/listen_together_multi/vendor/axios.min.js?v=88"
    />
    <link
      rel="preload"
      as="script"
      href="/listen_together_multi/js/core.js?v=88"
    />
    <link
      rel="preload"
      as="script"
      href="/listen_together_multi/js/boot.js?v=88"
    />
  </head>
  <body>
    <div id="app"></div>

    <!-- ================= 根 ================= -->
    <template id="tpl-app">
      <div class="lt-app" :data-theme="resolvedTheme">

        <div class="lt-ambient" v-if="view === 'room'">
          <div class="lt-ambient__img" :style="ambientStyle"></div>
          <div class="lt-ambient__veil"></div>
        </div>

        <lt-login v-if="view === 'login'"></lt-login>
        <lt-lobby v-else-if="view === 'lobby'"></lt-lobby>

        <div
          v-else
          class="lt-room"
          :data-pane="pane"
          :class="{ 'is-immersive': immersive, 'has-lyrics': lyricsOpen }"
        >
          <lt-topbar></lt-topbar>

          <aside class="lt-members" aria-label="在线成员">
            <lt-members></lt-members>
          </aside>

          <section class="lt-stage" aria-label="正在播放">
            <lt-stage></lt-stage>
          </section>

          <aside class="lt-queue" aria-label="播放队列">
            <lt-queue></lt-queue>
          </aside>

          <aside class="lt-chat" aria-label="房间聊天">
            <lt-chat></lt-chat>
          </aside>

          <nav class="lt-tabbar" aria-label="房间分区">
            <button
              class="lt-tabbar__item"
              :class="{ 'is-active': pane === 'stage' }"
              @click="setPane('stage')"
            >
              <i class="lt-icon fa-solid fa-music" aria-hidden="true"></i>
              <span>房间</span>
            </button>
            <button
              class="lt-tabbar__item"
              :class="{ 'is-active': pane === 'queue' }"
              @click="setPane('queue')"
            >
              <i class="lt-icon fa-solid fa-list-ul" aria-hidden="true"></i>
              <span>队列</span>
            </button>
            <button
              class="lt-tabbar__item"
              :class="{ 'is-active': pane === 'chat' }"
              @click="setPane('chat')"
            >
              <i
                class="lt-icon fa-solid fa-comment-dots"
                aria-hidden="true"
              ></i>
              <span>聊天</span>
              <span v-if="chatUnread" class="lt-tabbar__badge"
                >{{ chatUnread > 99 ? '99+' : chatUnread }}</span
              >
            </button>
          </nav>
        </div>

        <lt-members-drawer v-if="membersOpen"></lt-members-drawer>
        <lt-song-picker v-if="songOpen"></lt-song-picker>
        <lt-share-sheet v-if="shareOpen"></lt-share-sheet>
        <lt-invite-sheet v-if="inviteOpen"></lt-invite-sheet>
        <lt-collect-sheet v-if="collectOpen"></lt-collect-sheet>
        <lt-settings v-if="settingsOpen"></lt-settings>
        <lt-debug v-if="debugOpen"></lt-debug>
        <lt-landing v-if="landingInfo"></lt-landing>
        <lt-toasts></lt-toasts>

        <div class="lt-sr" role="status" aria-live="polite">{{ message }}</div>
        <audio id="player" preload="metadata"></audio>
        <audio id="previewAudio" preload="metadata"></audio>
      </div>
    </template>

    <!-- ================= 登录 ================= -->
    <template id="tpl-login">
      <div class="lt-login">
        <div class="lt-login__inner">
          <div class="lt-login__copy">
            <div class="lt-brand">
              <span class="lt-brand__mark"
                ><i
                  class="lt-icon lt-icon--lg fa-solid fa-headphones"
                  aria-hidden="true"
                ></i
              ></span>
              <div>
                <div class="lt-brand__name">一起听</div>
                <div class="lt-brand__sub">API-Enhanced · Multi Room</div>
              </div>
            </div>
            <h1 class="lt-login__title">把耳机分他一半，<em>一起听</em>。</h1>
            <p class="lt-login__lead">
              多人一起听房间的网页控制台。扫码登录后即可创建房间、随机匹配、和朋友同步播放、排队推歌与聊天。
            </p>
            <ul class="lt-login__points">
              <li>
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-music"
                  aria-hidden="true"
                ></i
                >实时同步播放
              </li>
              <li>
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-list-ul"
                  aria-hidden="true"
                ></i
                >多人排队推歌
              </li>
              <li>
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-comment-dots"
                  aria-hidden="true"
                ></i
                >表情与歌曲卡片
              </li>
            </ul>
          </div>

          <div class="lt-login__card">
            <div
              class="lt-qr"
              :class="{ 'is-masked': qr.status !== 'waiting' && qr.status !== 'scanned' }"
            >
              <img v-if="qr.img" :src="qr.img" alt="网易云音乐登录二维码" />
              <div
                v-else
                class="lt-skeleton"
                style="width: 100%; height: 100%"
              ></div>
              <div
                v-if="qr.status === 'expired' || qr.status === 'error'"
                class="lt-qr__overlay"
              >
                <strong
                  >{{ qr.status === 'expired' ? '二维码已过期' : '二维码加载失败' }}</strong
                >
                <button
                  class="lt-btn lt-btn--sm lt-btn--primary"
                  @click="startQrLogin"
                >
                  重新获取
                </button>
              </div>
            </div>

            <div class="lt-login__state" :class="'is-' + qrTone">
              <i></i><span>{{ qr.text }}</span>
            </div>

            <div class="lt-login__fallback">
              <button
                class="lt-btn lt-btn--soft lt-btn--block"
                @click="login(false)"
              >
                我已登录，刷新状态
              </button>
            </div>

            <div class="lt-login__links">
              <a href="/qrlogin.html" target="_blank" rel="noopener"
                >在新页面扫码</a
              >
              <span>·</span>
              <a href="/docs/" target="_blank" rel="noopener">接口文档</a>
            </div>
            <p class="lt-hint">
              登录态来自浏览器 Cookie，或服务端配置的 NETEASE_COOKIE。
            </p>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 大厅 ================= -->
    <template id="tpl-lobby">
      <div class="lt-lobby">
        <div class="lt-lobby__head">
          <div class="lt-brand">
            <span class="lt-brand__mark"
              ><i
                class="lt-icon lt-icon--lg fa-solid fa-headphones"
                aria-hidden="true"
              ></i
            ></span>
            <div>
              <div class="lt-brand__name">一起听</div>
              <div class="lt-brand__sub">API-Enhanced · Multi Room</div>
            </div>
          </div>
          <div class="lt-lobby__account">
            <img
              v-if="account.avatar"
              :src="img(account.avatar, 96)"
              class="lt-avatar lt-avatar--sm"
              alt=""
            />
            <span>{{ account.nickname || '未登录' }}</span>
            <button
              class="lt-icon-btn"
              title="设置"
              @click="settingsOpen = true"
            >
              <i class="lt-icon fa-solid fa-gear" aria-hidden="true"></i>
            </button>
            <button
              class="lt-icon-btn"
              :title="theme === 'dark' ? '切换到浅色' : theme === 'light' ? '跟随系统' : '切换到深色'"
              @click="cycleTheme"
            >
              <i
                class="lt-icon"
                :class="resolvedTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-regular fa-sun'"
              ></i>
            </button>
          </div>
        </div>

        <section class="lt-hero">
          <span class="lt-hero__eyebrow"
            ><i
              class="lt-icon lt-icon--sm fa-solid fa-tower-broadcast"
              aria-hidden="true"
            ></i
            >ROOM CONSOLE · 网页版</span
          >
          <h1 class="lt-hero__title">和喜欢的人，<em>同步听同一首歌</em>。</h1>
          <p class="lt-hero__desc">
            创建房间、随机匹配陌生人，或加入朋友的邀请。播放进度由房间同步，谁都能往队列里推歌。
          </p>
        </section>

        <div v-if="resumeRoom" class="lt-lobby__resume">
          <div class="lt-lobby__resume-text">
            你的账号还在房间里：<strong>{{ resumeRoom.roomId }}</strong>
            <template v-if="resumeRoom.members">
              · {{ resumeRoom.members }} 人</template
            >
          </div>
          <button
            class="lt-btn lt-btn--sm lt-btn--primary"
            @click="resumeRoomJoin"
          >
            继续加入
          </button>
          <button
            class="lt-btn lt-btn--sm lt-btn--ghost"
            @click="resumeRoom = null"
          >
            忽略
          </button>
        </div>

        <div class="lt-lobby__grid">
          <!-- 随机匹配 -->
          <section class="lt-panel lt-panel--primary">
            <div class="lt-panel__head">
              <div class="lt-panel__title">
                <span class="lt-panel__icon"
                  ><i
                    class="lt-icon fa-solid fa-tower-broadcast"
                    aria-hidden="true"
                  ></i
                ></span>
                随机匹配
              </div>
              <span class="lt-chip is-info">公房</span>
            </div>

            <template v-if="isMatching">
              <div class="lt-radar">
                <span class="lt-radar__ring"></span>
                <span class="lt-radar__ring"></span>
                <span class="lt-radar__ring"></span>
                <span class="lt-radar__core"
                  ><i
                    class="lt-icon lt-icon--lg fa-solid fa-magnifying-glass"
                    aria-hidden="true"
                  ></i
                ></span>
              </div>
              <p class="lt-hint" style="text-align: center">
                正在寻找房间 · {{ matchSeconds }}s
              </p>
              <button
                class="lt-btn lt-btn--danger lt-btn--block"
                @click="cancelMatch"
              >
                取消匹配
              </button>
            </template>

            <template v-else>
              <div v-if="matchSong" class="lt-picked">
                <img v-if="matchSong.cover" :src="img(matchSong.cover, 128)" alt="" />
                <div class="lt-picked__text">
                  <div class="lt-picked__name">{{ matchSong.name }}</div>
                  <div class="lt-picked__artist">{{ matchSong.artist }}</div>
                </div>
                <button
                  class="lt-btn lt-btn--sm"
                  @click="openSongDialog('initial')"
                >
                  更换
                </button>
              </div>
              <button
                v-else
                class="lt-picked is-empty"
                @click="openSongDialog('initial')"
              >
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-plus"
                  aria-hidden="true"
                ></i
                >选择一首匹配用歌
              </button>
              <button
                class="lt-btn lt-btn--primary lt-btn--block"
                :disabled="!canMatch"
                @click="startMatch"
              >
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-magnifying-glass"
                  aria-hidden="true"
                ></i
                >开始匹配
              </button>
              <p class="lt-lobby__hint">
                <i
                  class="lt-icon lt-icon--sm fa-solid fa-clock"
                  aria-hidden="true"
                ></i>
                先进匹配池再等通知，一般 5–30 秒；需要另一名在线用户。
              </p>
            </template>
          </section>

          <!-- 创建房间 -->
          <section class="lt-panel">
            <div class="lt-panel__head">
              <div class="lt-panel__title">
                <span class="lt-panel__icon"
                  ><i class="lt-icon fa-solid fa-plus" aria-hidden="true"></i
                ></span>
                创建房间
              </div>
              <span class="lt-chip">{{ allowStranger ? '公房' : '私房' }}</span>
            </div>

            <div v-if="matchSong" class="lt-picked">
              <img v-if="matchSong.cover" :src="img(matchSong.cover, 128)" alt="" />
              <div class="lt-picked__text">
                <div class="lt-picked__name">{{ matchSong.name }}</div>
                <div class="lt-picked__artist">{{ matchSong.artist }}</div>
              </div>
              <button
                class="lt-btn lt-btn--sm"
                @click="openSongDialog('initial')"
              >
                更换
              </button>
            </div>
            <button
              v-else
              class="lt-picked is-empty"
              @click="openSongDialog('initial')"
            >
              <i
                class="lt-icon lt-icon--sm fa-solid fa-plus"
                aria-hidden="true"
              ></i
              >创建房间也需要先选歌
            </button>

            <label class="lt-join-toggle">
              <span>允许陌生人加入（进入公房池）</span>
              <span
                class="lt-switch"
                :class="{ 'is-on': allowStranger }"
                role="switch"
                :aria-checked="allowStranger"
              >
                <input
                  v-model="allowStranger"
                  type="checkbox"
                  tabindex="-1"
                />
              </span>
            </label>

            <button
              class="lt-btn lt-btn--block"
              :disabled="!canMatch || creatingRoom"
              @click="createRoom"
            >
              {{ creatingRoom ? '创建中…' : '创建' + (allowStranger ? '公开' : '私密') + '好友房' }}
            </button>
            <p class="lt-lobby__hint">
              <i
                class="lt-icon lt-icon--sm fa-solid fa-users"
                aria-hidden="true"
              ></i>
              公房有 60s 加歌冷却，私房无冷却；创建后可复制链接邀请。
            </p>
          </section>

          <!-- 加入房间 -->
          <section class="lt-panel">
            <div class="lt-panel__head">
              <div class="lt-panel__title">
                <span class="lt-panel__icon"
                  ><i class="lt-icon fa-solid fa-link" aria-hidden="true"></i
                ></span>
                加入房间
              </div>
            </div>

            <div class="lt-field">
              <label class="lt-field__label">分享链接 / 房间号</label>
              <div class="lt-input-row">
                <input
                  v-model="shareLinkInput"
                  class="lt-input"
                  type="text"
                  placeholder="粘贴 163cn.tv 链接或房间 ID"
                  @input="onShareInput"
                  @keyup.enter="parseShareLink"
                />
                <button
                  class="lt-btn lt-btn--sm"
                  :disabled="shareResolving"
                  @click="parseShareLink"
                >
                  {{ shareResolving ? '解析中' : '解析' }}
                </button>
              </div>
            </div>

            <div class="lt-field">
              <label class="lt-field__label">邀请者 UID</label>
              <input
                v-model="joinForm.inviterId"
                class="lt-input"
                type="text"
                inputmode="numeric"
                placeholder="通常可从分享链接自动带出"
              />
            </div>

            <div v-if="joinForm.roomId" class="lt-picked">
              <span class="lt-panel__icon"
                ><i class="lt-icon fa-solid fa-music" aria-hidden="true"></i
              ></span>
              <div class="lt-picked__text">
                <div class="lt-picked__name">房间 {{ joinForm.roomId }}</div>
                <div class="lt-picked__artist">
                  {{ joinForm.inviterId ? '邀请者 ' + joinForm.inviterId : '缺少邀请者 UID' }}
                </div>
              </div>
            </div>

            <button
              class="lt-btn lt-btn--primary lt-btn--block"
              :disabled="!joinForm.roomId || !joinForm.inviterId || joiningRoom"
              @click="joinRoom"
            >
              {{ joiningRoom ? '加入中…' : '确认加入' }}
            </button>
            <p class="lt-lobby__hint">
              <i
                class="lt-icon lt-icon--sm fa-solid fa-triangle-exclamation"
                aria-hidden="true"
              ></i>
              解析只提取房间信息，不会执行链接里的其它内容。
            </p>
          </section>
        </div>
      </div>
    </template>

    <!-- ================= 顶栏 ================= -->
    <template id="tpl-topbar">
      <header class="lt-topbar">
        <div class="lt-topbar__lead">
          <button
            class="lt-icon-btn"
            title="房间菜单"
            aria-label="房间菜单"
            @click="leaveMenuOpen = !leaveMenuOpen"
          >
            <i class="lt-icon fa-solid fa-arrow-left" aria-hidden="true"></i>
          </button>
          <div class="lt-topbar__title">
            <span class="lt-chip" :class="'is-' + roomTypeInfo.cls"
              >{{ roomTypeInfo.label }}</span
            >
            <span class="lt-topbar__meta"
              >{{ memberCount }} 人在线</span
            >
            <span class="lt-sync" :class="'is-' + syncState">
              <i></i>{{ syncLabel }}
            </span>
          </div>
        </div>

        <div class="lt-topbar__actions">
          <button
            class="lt-btn lt-btn--ghost lt-btn--sm lt-hide-before-wide lt-hide-sm"
            @click="membersOpen = true"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-users"
              aria-hidden="true"
            ></i
            >成员
          </button>
          <button
            class="lt-btn lt-btn--ghost lt-btn--sm"
            @click="shareOpen = true"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-share-nodes"
              aria-hidden="true"
            ></i
            ><span class="lt-only-wide">分享</span>
          </button>
          <button
            class="lt-btn lt-btn--ghost lt-btn--sm lt-only-wide"
            @click="inviteOpen = true"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-user-plus"
              aria-hidden="true"
            ></i
            >邀请
          </button>
          <button
            class="lt-btn lt-btn--primary lt-btn--sm"
            @click="openSongDialog('add')"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-plus"
              aria-hidden="true"
            ></i
            >添加歌曲
          </button>
          <button
            class="lt-icon-btn lt-only-touch"
            title="聊天"
            @click="goChat()"
          >
            <i class="lt-icon fa-solid fa-comment-dots" aria-hidden="true"></i>
          </button>
          <button class="lt-icon-btn" title="设置" @click="settingsOpen = true">
            <i class="lt-icon fa-solid fa-gear" aria-hidden="true"></i>
          </button>
        </div>

        <div
          v-if="leaveMenuOpen"
          class="lt-menu lt-topbar__menu"
          @mouseleave="leaveMenuOpen = false"
        >
          <button
            class="lt-menu__item"
            @click="shareOpen = true; leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-share-nodes"
              aria-hidden="true"
            ></i
            >分享房间
          </button>
          <button
            class="lt-menu__item"
            @click="inviteOpen = true; leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-user-plus"
              aria-hidden="true"
            ></i
            >邀请好友
          </button>
          <button
            class="lt-menu__item"
            @click="membersOpen = true; leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-users"
              aria-hidden="true"
            ></i
            >在线成员
          </button>
          <button class="lt-menu__item" @click="toggleImmersive">
            <i
              class="lt-icon lt-icon--sm fa-solid fa-expand"
              aria-hidden="true"
            ></i
            >{{ immersive ? '退出沉浸' : '沉浸模式' }}
          </button>
          <button
            class="lt-menu__item"
            @click="refreshRoom(); leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-rotate-right"
              aria-hidden="true"
            ></i
            >刷新房间状态
          </button>
          <div class="lt-menu__sep"></div>
          <button
            class="lt-menu__item"
            :disabled="isMatching || rematching"
            @click="rematch(); leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-magnifying-glass"
              aria-hidden="true"
            ></i
            >重新匹配
          </button>
          <button
            class="lt-menu__item is-danger"
            @click="exitRoom(); leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-arrow-right-from-bracket"
              aria-hidden="true"
            ></i
            >退出房间
          </button>
          <button
            class="lt-menu__item is-danger"
            @click="debugOpen = true; leaveMenuOpen = false"
          >
            <i
              class="lt-icon lt-icon--sm fa-solid fa-triangle-exclamation"
              aria-hidden="true"
            ></i
            >调试与诊断
          </button>
        </div>
      </header>
    </template>

    <!-- ================= 成员 ================= -->
    <template id="tpl-members">
      <div v-if="!flat" class="lt-colhead">
        <div class="lt-colhead__title">
          在线成员
          <small>
            {{ roomInfo.roomUsers.length }}<template
              v-if="memberCount > roomInfo.roomUsers.length"
              > / {{ memberCount }}</template
            >
          </small>
        </div>
        <span class="lt-chip" :class="imConnected ? 'is-ok' : 'is-warn'">
          {{ imConnected ? 'IM 实时' : 'HTTP 快照' }}
        </span>
      </div>

      <ul class="lt-people">
        <li
          v-for="(u, i) in roomInfo.roomUsers"
          :key="'user-' + i"
          class="lt-person"
        >
          <img v-if="u.avatar" :src="img(u.avatar, 96)" class="lt-avatar" alt="" />
          <span v-else class="lt-avatar lt-avatar-fallback"
            >{{ initialOf(u.nickname) }}</span
          >
          <span class="lt-person__text">
            <span class="lt-person__name">{{ u.nickname || '匿名听友' }}</span>
            <span class="lt-person__uid">UID {{ userUid(u) || '?' }}</span>
          </span>
          <span
            v-if="String(userUid(u)) === String(roomInfo.creatorId)"
            class="lt-chip is-accent"
            >房主</span
          >
          <span v-else-if="isMe(u)" class="lt-chip">我</span>
          <span v-else class="lt-person__dot" title="在线"></span>
        </li>
      </ul>

      <div v-if="!roomInfo.roomUsers.length" class="lt-empty">
        <div class="lt-empty__art">
          <i class="lt-icon fa-solid fa-users" aria-hidden="true"></i>
        </div>
        <div class="lt-empty__title">暂无成员信息</div>
        <div>房间状态还没有返回成员列表</div>
      </div>

      <div v-if="memberCount > roomInfo.roomUsers.length" class="lt-members__truncated">
        服务端只下发部分成员（官方客户端也只是「前几个头像 + 人数」），房间内另有
        {{ memberCount - roomInfo.roomUsers.length }} 人未公开
      </div>

      <div class="lt-members__foot">
        <button
          class="lt-btn lt-btn--soft lt-btn--block"
          @click="inviteOpen = true"
        >
          <i
            class="lt-icon lt-icon--sm fa-solid fa-user-plus"
            aria-hidden="true"
          ></i
          >邀请好友
        </button>
        <div class="lt-members__im">
          <button
            class="lt-btn"
            :disabled="imConnecting"
            @click="toggleImMembers"
          >
            {{ imConnected ? '断开 IM' : imConnecting ? '连接中…' : '连接 IM 实时成员' }}
          </button>
          <span class="lt-members__im-text" :title="imStatus"
            >{{ imStatus || '未连接' }}</span
          >
        </div>
      </div>
    </template>

    <!-- ================= 主舞台 ================= -->
    <template id="tpl-stage">
      <div class="lt-player">
        <div class="lt-player__art" :class="{ 'is-playing': audioPlaying }">
          <img
            v-if="playingInfo.cover"
            :src="img(playingInfo.cover, 640)"
            class="lt-player__cover"
            :class="{ 'is-paused': !audioPlaying }"
            alt=""
          />
          <div v-else class="lt-player__cover lt-skeleton"></div>
          <div v-if="audioPlaying" class="lt-eq" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
        </div>

        <div class="lt-player__body">
          <div class="lt-player__kicker">
            <span class="lt-live"><i></i>正在一起听</span>
            <span class="lt-chip" :class="'is-' + currentSongSource.type"
              >{{ currentSongSource.label }}</span
            >
            <span v-if="cooldownLeft > 0" class="lt-chip is-warn"
              >加歌冷却 {{ cooldownLeft }}s</span
            >
            <span v-else class="lt-chip is-ok">可加歌</span>
          </div>

          <h2 class="lt-player__title" :title="songName">
            <template v-if="!songNameLong">{{ songName }}</template>
            <span v-else class="lt-marquee">
              <span class="lt-marquee__inner"
                ><span>{{ songName }}</span
                ><span aria-hidden="true">{{ songName }}</span></span
              >
            </span>
          </h2>

          <div class="lt-player__artist">
            <template v-if="!songArtistLong">{{ songArtist }}</template>
            <span v-else class="lt-marquee">
              <span class="lt-marquee__inner"
                ><span>{{ songArtist }}</span
                ><span aria-hidden="true">{{ songArtist }}</span></span
              >
            </span>
          </div>

          <div class="lt-player__progress">
            <input
              type="range"
              class="lt-range"
              min="0"
              :max="progressMax"
              step="0.1"
              :value="audioCurrentTime"
              :style="{ '--fill': progressPercent + '%' }"
              aria-label="播放进度"
              @input="onSeek"
              @change="onSeek"
            />
            <div class="lt-player__times">
              <span>{{ formatAudioTime(audioCurrentTime) }}</span>
              <span class="lt-player__duration"
                >SongID {{ playingInfo.songId || '—' }}</span
              >
              <span>{{ formatAudioTime(progressMax) }}</span>
            </div>
          </div>
        </div>

        <div class="lt-player__controls">
          <button
            class="lt-play"
            :class="{ 'is-paused': !audioPlaying }"
            :aria-label="audioPlaying ? '暂停' : '播放'"
            @click="togglePlay"
          >
            <i
              class="lt-icon"
              :class="audioPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play'"
              aria-hidden="true"
            ></i>
          </button>

          <button
            class="lt-stat"
            :class="{ 'is-on': playingInfo.uped }"
            :disabled="!roomInfo.permission.topSong"
            title="UP 顶歌"
            @click="operateSong(2, playingInfo.songId, playingInfo.bizId)"
          >
            <i class="lt-icon fa-solid fa-arrow-up" aria-hidden="true"></i>
            <span class="lt-stat__count">{{ playingInfo.upCnt || 0 }}</span>
          </button>

          <button class="lt-stat" title="一起听点赞" @click="likeCurrentSong">
            <i class="lt-icon fa-solid fa-thumbs-up" aria-hidden="true"></i>
            <span class="lt-stat__count">{{ playingInfo.zanCnt || 0 }}</span>
          </button>

          <button
            class="lt-stat"
            :class="{ 'is-on': likedMap[String(playingInfo.songId)] }"
            :aria-pressed="!!likedMap[String(playingInfo.songId)]"
            title="喜欢这首歌（长按收藏到歌单）"
            @pointerdown="startLikeLongPress"
            @pointerup="endLikeLongPress"
            @pointerleave="cancelLikeLongPress"
            @pointercancel="cancelLikeLongPress"
            @contextmenu="openCollectMenu"
            @click="onLikeClick"
          >
            <i
              class="lt-icon"
              :class="likedMap[String(playingInfo.songId)] ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"
              aria-hidden="true"
            ></i>
          </button>

          <button
            class="lt-stat"
            :disabled="!roomInfo.permission.switchSong"
            title="请求下一首"
            @click="nextSong"
          >
            <i class="lt-icon fa-solid fa-forward-step" aria-hidden="true"></i>
            <span class="lt-stat__label">下一首</span>
          </button>
        </div>

        <div class="lt-player__tools">
          <div class="lt-volume">
            <button
              class="lt-icon-btn"
              :title="audioVolume > 0 ? '静音' : '取消静音'"
              @click="toggleMute"
            >
              <i
                class="lt-icon"
                :class="audioVolume > 0 ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark'"
                aria-hidden="true"
              ></i>
            </button>
            <div class="lt-volume__track">
              <input
                class="lt-range"
                type="range"
                min="0"
                max="1"
                step="0.01"
                :value="audioVolume"
                :style="{ '--fill': Math.round(audioVolume * 100) + '%' }"
                aria-label="音量"
                @input="onVolumeInput"
                @wheel.prevent="onVolumeWheel"
              />
            </div>
            <span class="lt-volume__pct"
              >{{ Math.round(audioVolume * 100) }}%</span
            >
          </div>

          <div class="lt-quality">
            <button
              class="lt-quality__btn"
              :class="{ 'is-open': qualityMenuOpen }"
              :aria-expanded="qualityMenuOpen"
              aria-haspopup="listbox"
              title="音质"
              @click="qualityMenuOpen = !qualityMenuOpen"
            >
              <i
                class="lt-icon lt-icon--sm fa-solid fa-sliders"
                aria-hidden="true"
              ></i>
              <span>{{ levelLabel(audioLevel) }}</span>
              <i
                class="lt-icon lt-icon--sm fa-solid fa-chevron-down"
                aria-hidden="true"
              ></i>
            </button>
            <div v-if="qualityMenuOpen" class="lt-menu lt-quality__menu" role="listbox">
              <button
                v-for="l in audioLevels"
                :key="l.key"
                class="lt-menu__item"
                :class="{ 'is-active': l.key === audioLevel }"
                role="option"
                :aria-selected="l.key === audioLevel"
                @click="onQualitySelect(l.key)"
              >
                <span>{{ l.label }}</span>
                <i
                  v-if="l.key === audioLevel"
                  class="lt-icon fa-solid fa-check"
                  aria-hidden="true"
                ></i>
              </button>
            </div>
          </div>

          <div class="lt-player__tools-spacer"></div>

          <button
            class="lt-icon-btn"
            :class="{ 'is-active': lyricsOpen }"
            title="歌词（L）"
            @click="toggleLyrics"
          >
            <i class="lt-icon fa-solid fa-align-left" aria-hidden="true"></i>
          </button>
          <button class="lt-icon-btn" title="沉浸模式" @click="toggleImmersive">
            <i class="lt-icon fa-solid fa-expand" aria-hidden="true"></i>
          </button>
        </div>

        <p
          v-if="playingInfo.actualLevel && playingInfo.actualLevel !== audioLevel"
          class="lt-player__note"
        >
          当前实际音质 {{ levelLabel(playingInfo.actualLevel) }}（已自动降级）
        </p>
      </div>

      <section v-if="lyricsOpen" class="lt-lyrics">
        <div class="lt-lyrics__head">
          <div class="lt-card__title">
            歌词 <small>{{ lyrics.title || '' }}</small>
          </div>
          <div class="lt-colhead__actions">
            <button
              class="lt-btn lt-btn--sm lt-btn--ghost"
              @click="lyricsFollow = true; scrollLyricsToActive(true)"
            >
              回到当前
            </button>
            <button
              class="lt-icon-btn"
              title="收起歌词"
              @click="lyricsOpen = false"
            >
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div
          ref="lyricsBox"
          class="lt-lyrics__body"
          @scroll.passive="onLyricsScroll"
        >
          <div v-if="lyrics.loading" class="lt-lyrics__empty">
            正在加载歌词…
          </div>
          <div
            v-else-if="lyrics.error || !lyrics.lines.length"
            class="lt-lyrics__empty"
          >
            {{ lyrics.error || '这首歌还没有歌词' }}
          </div>
          <div v-else class="lt-lyrics__list" ref="lyricsList">
            <div
              v-for="(line, li) in lyrics.lines"
              :key="'lyric-' + li"
              class="lt-lyrics__line"
              :class="{ 'is-active': li === lyricsActiveIndex }"
            >
              <span>{{ line.text || '··' }}</span>
              <span v-if="line.translation" class="lt-lyrics__trans"
                >{{ line.translation }}</span
              >
            </div>
          </div>
        </div>
      </section>

      <section class="lt-roominfo">
        <div class="lt-roominfo__row">
          <span class="lt-roominfo__label">房间</span>
          <span class="lt-roominfo__value" :title="roomInfo.roomId">{{ roomInfo.roomId }}</span>
          <button
            class="lt-btn lt-btn--sm lt-btn--ghost"
            @click="copyText(roomInfo.roomId, '房间 ID')"
          >
            复制
          </button>
          <span class="lt-roominfo__label">{{ memberCount }} 人</span>
          <span class="lt-roominfo__spacer"></span>
          <button
            class="lt-icon-btn lt-icon-btn--sm"
            title="分享房间"
            @click="shareOpen = true"
          >
            <i class="lt-icon fa-solid fa-share-nodes" aria-hidden="true"></i>
          </button>
          <button
            class="lt-icon-btn lt-icon-btn--sm"
            title="刷新房间状态"
            :disabled="refreshing"
            @click="refreshRoom()"
          >
            <i
              class="lt-icon fa-solid fa-rotate-right"
              :class="{ 'fa-spin': refreshing }"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <div class="lt-roominfo__row">
          <span class="lt-chip" :class="roomInfo.permission.addSong ? 'is-ok' : 'is-warn'"
            >加歌{{ roomInfo.permission.addSong ? '✓' : '✗' }}</span
          >
          <span
            class="lt-chip"
            :class="roomInfo.permission.switchSong ? 'is-ok' : 'is-warn'"
            >切歌{{ roomInfo.permission.switchSong ? '✓' : '✗' }}</span
          >
          <span
            class="lt-chip"
            :class="roomInfo.permission.topSong ? 'is-ok' : 'is-warn'"
            >顶歌{{ roomInfo.permission.topSong ? '✓' : '✗' }}</span
          >
          <button
            class="lt-btn lt-btn--sm lt-btn--ghost"
            :disabled="!currentSongUrl"
            @click="copyText(currentSongUrl, '歌曲链接')"
          >
            复制歌曲链接
          </button>
          <span
            v-for="(t, ti) in roomInfo.roomTags"
            :key="'roomtag-' + ti"
            class="lt-chip"
            >{{ t }}</span
          >
          <span v-if="roomInfo.hintText" class="lt-roominfo__note-inline">{{
            roomInfo.hintText
          }}</span>
        </div>
      </section>
    </template>

    <!-- ================= 队列 ================= -->
    <template id="tpl-queue">
      <div class="lt-colhead">
        <div class="lt-colhead__title">
          播放队列
          <small
            >{{ queueTab === 'wait' ? playingInfo.nextSongs.length : playedSongs.length }}</small
          >
        </div>
        <div class="lt-colhead__actions">
          <button class="lt-icon-btn" title="刷新队列" @click="refreshQueue">
            <i class="lt-icon fa-solid fa-rotate-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="lt-queue__tabs">
        <div class="lt-tabs">
          <button
            class="lt-tab"
            :class="{ 'is-active': queueTab === 'wait' }"
            @click="queueTab = 'wait'"
          >
            待播
            <span class="lt-tab__count"
              >{{ playingInfo.nextSongs.length }}</span
            >
          </button>
          <button
            class="lt-tab"
            :class="{ 'is-active': queueTab === 'played' }"
            @click="setQueueTab('played')"
          >
            已播 <span class="lt-tab__count">{{ playedSongs.length }}</span>
          </button>
        </div>
      </div>

      <div v-show="queueTab === 'wait'" class="lt-queue__list">
        <div
          v-for="(song, idx) in playingInfo.nextSongs"
          :key="'song-' + song.songId + '-' + song.bizId + '-' + idx"
          class="lt-track"
          :class="{ 'is-next': idx === 0 }"
        >
          <img
            v-if="song.cover"
            :src="img(song.cover, 96)"
            class="lt-track__cover"
            alt=""
          />
          <div v-else class="lt-track__cover lt-skeleton"></div>
          <div class="lt-track__main">
            <div class="lt-track__title" :title="song.name">
              {{ song.name }}
            </div>
            <div class="lt-track__sub" :title="song.artist">
              {{ song.artist }}
            </div>
            <div class="lt-track__meta">
              <span v-if="idx === 0" class="lt-chip is-accent">下一首</span>
              <span
                class="lt-chip"
                :class="song.isMine ? 'is-mine' : song.songRcmdUid ? '' : 'is-info'"
                >{{ songSource(song).label }}</span
              >
              <span
                v-if="upCntMap[String(song.bizId)] && upCntMap[String(song.bizId)].uped"
                class="lt-chip is-ok"
                >我顶过</span
              >
            </div>
          </div>
          <div class="lt-track__actions">
            <button
              class="lt-track__up"
              :class="{ 'is-on': upCntMap[String(song.bizId)] && upCntMap[String(song.bizId)].uped }"
              title="UP 顶歌"
              @click.stop="operateSong(2, song.songId, song.bizId)"
            >
              <i class="lt-icon fa-solid fa-arrow-up" aria-hidden="true"></i>{{ (upCntMap[String(song.bizId)] && upCntMap[String(song.bizId)].upCnt) || 0 }}
            </button>
            <button
              v-if="song.isMine"
              class="lt-icon-btn lt-track__del"
              title="删除我的推荐"
              @click.stop="operateSong(7, song.songId, song.bizId)"
            >
              <i
                class="lt-icon lt-icon--sm fa-solid fa-trash-can"
                aria-hidden="true"
              ></i>
            </button>
          </div>
        </div>

        <div v-if="!playingInfo.nextSongs.length" class="lt-empty">
          <div class="lt-empty__art">
            <i class="lt-icon fa-solid fa-list-ul" aria-hidden="true"></i>
          </div>
          <div class="lt-empty__title">还没有待播歌曲</div>
          <div>点右上角「添加歌曲」往里推一首</div>
        </div>
      </div>

      <div v-show="queueTab === 'played'" class="lt-queue__list">
        <div
          v-if="playedLoading && !playedSongs.length"
          class="lt-queue__list"
          style="padding: 8px 4px"
        >
          <div v-for="n in 4" :key="'played-sk-' + n" class="lt-track">
            <div class="lt-track__cover lt-skeleton"></div>
            <div class="lt-track__main">
              <div class="lt-skeleton" style="height: 12px; width: 70%"></div>
              <div
                class="lt-skeleton"
                style="height: 10px; width: 42%; margin-top: 5px"
              ></div>
            </div>
          </div>
        </div>

        <div
          v-for="(song, pi) in playedSongs"
          :key="'played-' + song.bizId + '-' + pi"
          class="lt-track"
        >
          <img
            v-if="song.cover"
            :src="img(song.cover, 96)"
            class="lt-track__cover"
            alt=""
          />
          <div v-else class="lt-track__cover lt-skeleton"></div>
          <div class="lt-track__main">
            <div class="lt-track__title" :title="song.name">
              {{ song.name }}
            </div>
            <div class="lt-track__sub">{{ song.artist }}</div>
            <div class="lt-track__meta">
              <span class="lt-chip" :class="song.isMine ? 'is-mine' : ''"
                >{{ songSource(song).label }}</span
              >
              <span v-if="song.playTime" class="lt-track__time"
                >{{ formatRelativeTime(song.playTime) }}</span
              >
            </div>
          </div>
        </div>

        <div v-if="playedMore" class="lt-empty" style="padding: 10px">
          <button
            class="lt-btn lt-btn--sm"
            :disabled="playedLoading"
            @click="loadMorePlayed"
          >
            {{ playedLoading ? '加载中…' : '加载更早的已播' }}
          </button>
        </div>

        <div v-if="!playedLoading && !playedSongs.length" class="lt-empty">
          <div class="lt-empty__art">
            <i class="lt-icon fa-solid fa-clock" aria-hidden="true"></i>
          </div>
          <div class="lt-empty__title">还没有已播记录</div>
          <div>房间播放过的歌会出现在这里</div>
        </div>
      </div>

      <div class="lt-queue__foot">
        <span
          >{{ queueTab === 'wait' ? '顺序由房间同步' : '来自官方已播记录' }}</span
        >
        <button class="lt-btn lt-btn--sm" @click="openSongDialog('add')">
          <i class="lt-icon lt-icon--sm fa-solid fa-plus" aria-hidden="true"></i
          >推歌
        </button>
      </div>
    </template>

    <!-- ================= 聊天 ================= -->
    <template id="tpl-chat">
      <div class="lt-colhead">
        <div class="lt-tabs">
          <button
            class="lt-tab"
            :class="{ 'is-active': chatTab === 'chat' }"
            @click="setChatTab('chat')"
          >
            聊天
            <span v-if="chatUnread" class="lt-badge is-accent"
              >{{ chatUnread > 99 ? '99+' : chatUnread }}</span
            >
          </button>
          <button
            class="lt-tab"
            :class="{ 'is-active': chatTab === 'logs' }"
            @click="setChatTab('logs')"
          >
            日志
          </button>
        </div>
        <div class="lt-colhead__actions">
          <button class="lt-icon-btn" title="刷新聊天" @click="fetchChat()">
            <i class="lt-icon fa-solid fa-rotate-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <template v-if="chatTab === 'chat'">
        <div class="lt-chat__flow">
        <div
          id="chatList"
          ref="chatList"
          class="lt-msgs"
          @scroll.passive="onChatScroll"
        >
          <div class="lt-msgs__spacer" aria-hidden="true"></div>
          <button
            v-if="chatMore || chatLoadingMore"
            class="lt-msgs__more"
            :disabled="chatLoadingMore"
            @click="loadMoreChat"
          >
            {{ chatLoadingMore ? '正在加载更早消息…' : '加载更早消息' }}
          </button>

          <template
            v-for="(msg, mi) in chatHistory"
            :key="'chat-' + (msg.id || mi)"
          >
            <div v-if="showDayDivider(mi)" class="lt-msgs__day">
              {{ dayLabel(msg.sendTime) }}
            </div>
            <div v-if="mi === chatNewIndex" class="lt-msgs__new">未读消息</div>
            <div
              class="lt-msg"
              :class="{ 'is-system': msg.isSystem, 'is-me': isMeUid(msg.sendUid) }"
            >
              <template v-if="!msg.isSystem">
                <img
                  v-if="msg.avatarUrl"
                  :src="img(msg.avatarUrl, 72)"
                  class="lt-msg__avatar"
                  alt=""
                />
                <span v-else class="lt-msg__avatar lt-msg__avatar-fallback"
                  >{{ initialOf(msg.nickname) }}</span
                >
              </template>
              <div class="lt-msg__body">
                <div v-if="showMsgName(mi)" class="lt-msg__name">
                  <span>{{ msg.nickname || '听友' }}</span>
                </div>
                <div
                  class="lt-msg__bubble"
                  :class="{ 'is-sticker': msg.emojiUrl && !msg.text }"
                >
                  <template v-if="msg.emojiUrl">
                    <span class="lt-msg__emoji-wrap">
                      <img
                        :src="msg.emojiUrl"
                        class="lt-emoji-img"
                        :width="(msg.emoji && msg.emoji.width) || 160"
                        :height="(msg.emoji && msg.emoji.height) || 160"
                        :alt="msg.emoji && msg.emoji.emojiName"
                        @load="onChatImageLoad"
                      />
                      <button
                        class="lt-msg__emoji-save"
                        title="收藏这个表情"
                        @click.stop="saveSticker(msg.emoji)"
                      >
                        <i
                          class="lt-icon fa-solid fa-plus"
                          aria-hidden="true"
                        ></i>
                      </button>
                    </span>
                  </template>
                  <template v-else-if="msg.text">
                    <span v-html="formatMessageText(msg.text)"></span>
                  </template>

                  <div v-if="msg.cover" class="lt-songcard">
                    <img :src="img(msg.cover, 96)" alt="" @load="onChatImageLoad" />
                    <div class="lt-songcard__text">
                      <span class="lt-songcard__name">{{ msg.songName }}</span>
                      <span class="lt-songcard__artist"
                        >{{ msg.artistName }}</span
                      >
                    </div>
                    <button
                      v-if="msg.suggestSongId && roomInfo.permission.addSong"
                      class="lt-songcard__add"
                      @click.stop="operateSong(1, msg.suggestSongId)"
                    >
                      加歌
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <div v-if="!chatHistory.length" class="lt-empty">
            <div class="lt-empty__art">
              <i
                class="lt-icon fa-solid fa-comment-dots"
                aria-hidden="true"
              ></i>
            </div>
            <div class="lt-empty__title">还没有聊天消息</div>
            <div>说点什么，或者发个表情</div>
          </div>
          <div ref="chatBottom"></div>
        </div>

        <button
          v-if="!chatAtBottom || chatUnread"
          class="lt-chat__jump"
          :aria-label="chatUnread ? `回到最新消息，${chatUnread} 条未读` : '回到最新消息'"
          @click="jumpChatToBottom"
        >
          <i class="lt-icon fa-solid fa-arrow-down" aria-hidden="true"></i>
          <span v-if="chatUnread">{{ chatUnread > 99 ? '99+' : chatUnread }}</span>
        </button>
        </div>

        <div
          class="lt-composer"
          :class="{ 'is-disabled': !roomInfo.chatRoomId }"
        >
          <lt-emoji
            v-if="emojiPickerOpen"
            @insert="insertEmojiText"
            @sticker="sendSticker"
          ></lt-emoji>

          <div
            v-if="mentionOpen && mentionCandidates.length"
            class="lt-mentions"
          >
            <button
              v-for="(u, ui) in mentionCandidates"
              :key="'mention-' + userUid(u)"
              class="lt-mentions__item"
              :class="{ 'is-active': ui === mentionIndex }"
              @mousedown.prevent="applyMention(u)"
            >
              <img v-if="u.avatar" :src="img(u.avatar, 96)" alt="" />
              <span v-else class="lt-avatar-fallback"
                >{{ initialOf(u.nickname) }}</span
              >
              <span>{{ u.nickname || '听友' }}</span>
            </button>
          </div>

          <textarea
            ref="chatInput"
            v-model="chatInput"
            class="lt-composer__input"
            rows="1"
            maxlength="100"
            :placeholder="roomInfo.chatRoomId ? '说点什么…（Ctrl+Enter 发送）' : '房间还没有聊天室'"
            :disabled="!roomInfo.chatRoomId"
            @keydown="onChatKeydown"
            @input="onChatInputChange"
          ></textarea>

          <div class="lt-composer__bar">
            <button
              class="lt-icon-btn"
              :class="{ 'is-active': emojiPickerOpen }"
              title="表情"
              :disabled="!roomInfo.chatRoomId"
              @click="emojiPickerOpen = !emojiPickerOpen"
            >
              <i class="lt-icon fa-solid fa-face-smile" aria-hidden="true"></i>
            </button>
            <button
              class="lt-icon-btn"
              title="提及成员"
              :disabled="!roomInfo.chatRoomId"
              @click="openMentions('@')"
            >
              <span style="font-weight: 700; font-size: 15px">@</span>
            </button>
            <span
              class="lt-composer__count"
              :class="{ 'is-warn': chatInput.length >= 90 }"
              >{{ chatInput.length }}/100</span
            >
            <button
              class="lt-btn lt-btn--primary"
              :disabled="chatSending || !chatInput.trim() || !roomInfo.chatRoomId"
              title="Ctrl+Enter"
              @click="sendChat()"
            >
              <i
                class="lt-icon lt-icon--sm fa-solid fa-paper-plane"
                aria-hidden="true"
              ></i
              >{{ chatSending ? '发送中' : '发送' }}
            </button>
          </div>
        </div>
      </template>

      <template v-else>
        <div id="logList" class="lt-logs">
          <div
            v-for="(entry, li) in logEntries"
            :key="'log-' + li"
            class="lt-log"
          >
            <span class="lt-log__time">{{ logTime(entry.time) }}</span>
            <span class="lt-log__tag">{{ entry.tag }}</span>
            <span class="lt-log__msg"
              >{{ entry.msg }}<span v-if="entry.data" class="lt-log__data"
                >{{ entry.data }}</span
              ></span
            >
          </div>
          <div v-if="!logEntries.length" class="lt-empty">
            <div class="lt-empty__title">暂无日志</div>
          </div>
        </div>
        <div class="lt-logs__foot">
          <button class="lt-btn lt-btn--sm lt-btn--ghost" @click="clearLogs">
            清空
          </button>
          <button class="lt-btn lt-btn--sm" @click="exportDiagnostics">
            导出诊断
          </button>
        </div>
      </template>
    </template>

        <div class="lt-emoji__tabs">

          >
            表情包
          </button>
          <button
            class="lt-emoji__tab"

            @click="setEmojiTab('unicode')"
          >
            表情
          </button>
          <button
            class="lt-emoji__tab"
            :class="{ 'is-active': emojiTab === 'kaomoji' }"
            @click="setEmojiTab('kaomoji')"
          >
            颜文字
          </button>
        </div>

        <template v-if="emojiTab === 'pack'">
          <div class="lt-emoji__grid" @scroll="onEmojiScroll">
            <div
              v-for="emoji in myStickers"

              class="lt-emoji__cell"
            >
              <button

                :title="emoji.emojiName"

            <div

            >
              <div
                class="lt-skeleton"
                style="width: 80%; height: 80%; border-radius: 8px"

          <div class="lt-emoji__foot">

              {{ cloudLoading ? '读取中' : '刷新' }}

            :disabled="cloudLoading"

          <div class="lt-emoji__url">

            </button>

        <div v-else-if="emojiTab === 'unicode'" class="lt-emoji__grid">
          <button

        <div v-else class="lt-emoji__grid">
          <button
            v-for="face in kaomojiList"
            :key="'k-' + face"

    <!-- ================= 选歌 ================= -->
    <template id="tpl-song-picker">
      <div class="lt-overlay" @click.self="closeSongDialog">
        <div
          class="lt-modal lt-modal--picker"
          role="dialog"
          aria-modal="true"
          aria-label="选择歌曲"
        >
          <div class="lt-modal__head">
            <div>
              <div class="lt-modal__title">
                {{ songDialogMode === 'initial' ? '选择匹配用歌' : '添加歌曲到队列' }}
              </div>
              <div class="lt-hint">粘贴网易云歌曲链接，或输入歌名 / 歌手；选中即可试听</div>
            </div>
            <button class="lt-close" aria-label="关闭" @click="closeSongDialog">
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="lt-modal__body lt-picker">
            <div class="lt-picker__top">
              <div class="lt-tabs lt-picker__tabs">
                <button
                  class="lt-tab"
                  :class="{ 'is-active': pickerTab === 'search' }"
                  @click="setPickerTab('search')"
                >
                  搜索
                </button>
                <button
                  class="lt-tab"
                  :class="{ 'is-active': pickerTab === 'playlists' }"
                  @click="setPickerTab('playlists')"
                >
                  我的歌单
                </button>
              </div>

              <template v-if="pickerTab === 'search'">
                <div class="lt-search">
                  <i
                    class="lt-icon lt-icon--sm fa-solid fa-magnifying-glass"
                    aria-hidden="true"
                  ></i>
                  <input
                    ref="songInput"
                    v-model="songInput"
                    class="lt-input"
                    type="text"
                    placeholder="歌曲链接 / 歌名 / 歌手"
                    @input="onSongInput"
                    @keyup.enter="resolveSongInput"
                  />
                </div>
                <div v-if="searchHistory.length" class="lt-picker__history">
                  <span class="lt-hint">最近</span>
                  <button
                    v-for="(kw, ki) in searchHistory"
                    :key="'kw-' + ki"
                    class="lt-chip"
                    @click="songInput = kw; resolveSongInput()"
                  >
                    {{ kw }}
                  </button>
                </div>
              </template>
            </div>

            <div class="lt-picker__list" ref="pickerList" @scroll.passive="onPickerScroll">
              <template v-if="pickerTab === 'search'">
                <div v-if="songSearching" class="lt-picker__hint">
                  <i
                    class="lt-icon fa-solid fa-spinner fa-spin"
                    aria-hidden="true"
                  ></i>
                  正在解析 / 搜索…
                </div>

                <button
                  v-for="song in songResults"
                  :key="'pick-' + song.id"
                  class="lt-invite__row"
                  :class="{ 'is-on': selectedSong && selectedSong.id === song.id }"
                  @click="selectSong(song)"
                >
                  <img
                    v-if="song.cover"
                    :src="img(song.cover, 96)"
                    class="lt-track__cover"
                    alt=""
                  />
                  <span class="lt-invite__text">
                    <span class="lt-invite__name">{{ song.name }}</span>
                    <span class="lt-invite__sub">{{ song.artist }}</span>
                  </span>
                  <span
                    v-if="selectedSong && selectedSong.id === song.id"
                    class="lt-chip is-accent"
                    >已选</span
                  >
                </button>

                <button
                  v-if="searchMore"
                  class="lt-btn lt-btn--sm lt-picker__more"
                  :disabled="songSearching"
                  @click="loadMoreSearch"
                >
                  {{ songSearching ? '加载中…' : '加载更多结果' }}
                </button>

                <div
                  v-if="!songSearching && !songResults.length"
                  class="lt-empty"
                >
                  <div class="lt-empty__art">
                    <i
                      class="lt-icon fa-solid fa-magnifying-glass"
                      aria-hidden="true"
                    ></i>
                  </div>
                  <div class="lt-empty__title">粘贴链接或输入关键词</div>
                  <div>也可以切到「我的歌单」直接挑歌</div>
                </div>
              </template>

              <template v-else>
                <div v-if="activePlaylist" class="lt-picker__plhead">
                  <button
                    class="lt-icon-btn lt-icon-btn--sm"
                    title="返回歌单列表"
                    @click="closePlaylist()"
                  >
                    <i class="lt-icon fa-solid fa-arrow-left" aria-hidden="true"></i>
                  </button>
                  <div class="lt-picker__plhead-text">
                    <strong>{{ activePlaylist.name }}</strong>
                    <small>
                      {{ activePlaylistTracks.length }} /
                      {{ activePlaylist.trackCount || '?' }} 首
                    </small>
                  </div>
                  <button
                    class="lt-icon-btn lt-icon-btn--sm"
                    title="重新读取"
                    :disabled="activePlaylistLoading"
                    @click="loadPlaylistTracks(true)"
                  >
                    <i
                      class="lt-icon fa-solid fa-rotate-right"
                      :class="{ 'fa-spin': activePlaylistLoading }"
                      aria-hidden="true"
                    ></i>
                  </button>
                </div>

                <div v-else class="lt-picker__plhead">
                  <div class="lt-picker__plhead-text">
                    <strong>我的歌单</strong>
                    <small>创建与收藏的歌单</small>
                  </div>
                  <button
                    class="lt-icon-btn lt-icon-btn--sm"
                    title="刷新歌单"
                    :disabled="myPlaylistsLoading"
                    @click="loadMyPlaylists(true)"
                  >
                    <i
                      class="lt-icon fa-solid fa-rotate-right"
                      :class="{ 'fa-spin': myPlaylistsLoading }"
                      aria-hidden="true"
                    ></i>
                  </button>
                </div>

                <template v-if="activePlaylist">
                  <div v-if="activePlaylistLoading && !activePlaylistTracks.length" class="lt-picker__hint">
                    <i class="lt-icon fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                    正在读取歌单歌曲…
                  </div>
                  <div v-else-if="activePlaylistError" class="lt-picker__hint is-error">
                    {{ activePlaylistError }}
                    <button class="lt-btn lt-btn--sm" @click="loadPlaylistTracks(true)">重试</button>
                  </div>

                  <button
                    v-for="song in activePlaylistTracks"
                    :key="'pl-' + song.id"
                    class="lt-invite__row"
                    :class="{ 'is-on': selectedSong && selectedSong.id === song.id }"
                    @click="selectSong(song)"
                  >
                    <img
                      v-if="song.cover"
                      :src="img(song.cover, 96)"
                      class="lt-track__cover"
                      alt=""
                    />
                    <span class="lt-invite__text">
                      <span class="lt-invite__name">{{ song.name }}</span>
                      <span class="lt-invite__sub">{{ song.artist }}</span>
                    </span>
                    <span
                      v-if="selectedSong && selectedSong.id === song.id"
                      class="lt-chip is-accent"
                      >已选</span
                    >
                  </button>

                  <button
                    v-if="activePlaylistMore"
                    class="lt-btn lt-btn--sm lt-picker__more"
                    :disabled="activePlaylistLoading"
                    @click="loadMorePlaylistTracks"
                  >
                    {{ activePlaylistLoading ? '加载中…' : '加载更多歌曲' }}
                  </button>

                  <div
                    v-if="!activePlaylistLoading && !activePlaylistError && !activePlaylistTracks.length"
                    class="lt-empty"
                  >
                    <div class="lt-empty__art">
                      <i class="lt-icon fa-solid fa-music" aria-hidden="true"></i>
                    </div>
                    <div class="lt-empty__title">这个歌单还没有歌曲</div>
                  </div>
                </template>

                <template v-else>
                  <div v-if="myPlaylistsLoading && !myPlaylists.length" class="lt-picker__hint">
                    <i class="lt-icon fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                    正在读取歌单…
                  </div>
                  <div v-else-if="myPlaylistsError" class="lt-picker__hint is-error">
                    {{ myPlaylistsError }}
                    <button class="lt-btn lt-btn--sm" @click="loadMyPlaylists(true)">重试</button>
                  </div>

                  <button
                    v-for="playlist in myPlaylists"
                    :key="'plist-' + playlist.id"
                    class="lt-invite__row"
                    @click="openPlaylist(playlist)"
                  >
                    <img
                      v-if="playlist.cover"
                      :src="img(playlist.cover, 96)"
                      class="lt-track__cover"
                      alt=""
                    />
                    <span class="lt-invite__text">
                      <span class="lt-invite__name">{{ playlist.name }}</span>
                      <span class="lt-invite__sub">
                        {{ playlist.trackCount }} 首 · {{ playlist.subscribed ? '我收藏的' : '我创建的' }}
                      </span>
                    </span>
                    <i class="lt-icon fa-solid fa-chevron-right" aria-hidden="true"></i>
                  </button>

                  <div
                    v-if="!myPlaylistsLoading && !myPlaylistsError && !myPlaylists.length"
                    class="lt-empty"
                  >
                    <div class="lt-empty__art">
                      <i class="lt-icon fa-solid fa-list-ul" aria-hidden="true"></i>
                    </div>
                    <div class="lt-empty__title">还没有歌单</div>
                    <div>登录后会自动读取创建与收藏的歌单</div>
                  </div>
                </template>
              </template>
            </div>

            <div v-if="selectedSong" class="lt-picker__foot">
              <div class="lt-picked">
                <img
                  v-if="selectedSong.cover"
                  :src="img(selectedSong.cover, 128)"
                  alt=""
                />
                <div class="lt-picked__text">
                  <div class="lt-picked__name">{{ selectedSong.name }}</div>
                  <div class="lt-picked__artist">{{ selectedSong.artist }}</div>
                </div>
              </div>

              <div class="lt-preview">
                <button
                  class="lt-preview__play"
                  :aria-label="preview.playing ? '暂停试听' : '播放试听'"
                  @click="togglePreview"
                >
                  <i
                    class="lt-icon"
                    :class="
                      preview.loading
                        ? 'fa-solid fa-spinner fa-spin'
                        : preview.playing
                          ? 'fa-solid fa-pause'
                          : 'fa-solid fa-play'
                    "
                    aria-hidden="true"
                  ></i>
                </button>
                <div class="lt-preview__body">
                  <input
                    class="lt-range"
                    type="range"
                    min="0"
                    :max="preview.duration || selectedSong.duration / 1000 || 1"
                    step="0.1"
                    :value="preview.current"
                    :style="{ '--fill': previewPercent() + '%' }"
                    aria-label="试听进度"
                    @input="onPreviewSeek"
                  />
                  <div class="lt-preview__meta">
                    <span>
                      {{ formatAudioTime(preview.current) }} /
                      {{ formatAudioTime(preview.duration) }}
                    </span>
                    <span v-if="preview.loading" class="lt-preview__state"
                      >正在获取试听…</span
                    >
                    <span
                      v-else-if="preview.error"
                      class="lt-preview__state is-error"
                      >{{ preview.error }}</span
                    >
                    <span v-else-if="preview.trial" class="lt-chip is-warn"
                      >试听片段</span
                    >
                    <span v-else class="lt-chip is-ok">可拖动进度</span>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <div class="lt-modal__foot">
            <button class="lt-btn lt-btn--ghost" @click="closeSongDialog">
              取消
            </button>
            <button
              v-if="songDialogMode === 'add'"
              class="lt-btn lt-btn--primary"
              :disabled="!selectedSong || !roomInfo.permission.addSong || cooldownLeft > 0"
              @click="addSelectedSong"
            >
              {{ cooldownLeft > 0 ? '冷却中 剩 ' + cooldownLeft + 's' : '添加到队列' }}
            </button>
            <button
              v-else
              class="lt-btn lt-btn--primary"
              :disabled="!selectedSong"
              @click="closeSongDialog"
            >
              使用这首歌
            </button>
          </div>
        </div>
      </div>
    </template>
