          class="lt-modal"
          role="dialog"
          aria-modal="true"
          aria-label="邀请好友"
        >
          <div class="lt-modal__head">
            <div>
              <div class="lt-modal__title">邀请好友一起听</div>
              <div class="lt-hint">
                来自互关 / 推荐 / 群聊的候选，按在线状态排序
              </div>
            </div>
            <button
              class="lt-close"
              aria-label="关闭"
              @click="inviteOpen = false"
            >
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="lt-modal__body">
            <div v-if="inviteLoading" class="lt-empty">
              <div class="lt-empty__title">正在读取邀请候选…</div>
            </div>
            <div v-else-if="inviteError" class="lt-empty">
              <div class="lt-empty__title">{{ inviteError }}</div>
              <button class="lt-btn lt-btn--sm" @click="loadInvitePanel">
                重试
              </button>
            </div>

            <template v-else>
              <div v-if="inviteUsers.length" class="lt-invite__section">
                <div class="lt-invite__label">好友</div>
                <div class="lt-invite">
                  <button
                    v-for="u in inviteUsers"
                    :key="'invite-' + u.uid"
                    class="lt-invite__row"
                    :class="{ 'is-on': inviteSelected.includes(String(u.uid)), 'is-disabled': u.inRoom }"
                    :disabled="u.inRoom"
                    @click="toggleInviteUser(u)"
                  >
                    <img
                      v-if="u.avatar"
                      :src="u.avatar"
                      class="lt-avatar lt-avatar--sm"
                      alt=""
                    />
                    <span
                      v-else
                      class="lt-avatar lt-avatar--sm lt-avatar-fallback"
                      >{{ initialOf(u.nickname) }}</span
                    >
                    <span class="lt-invite__text">
                      <span class="lt-invite__name"
                        >{{ u.nickname || u.uid }}</span
                      >
                      <span class="lt-invite__sub">
                        {{ u.inRoom ? '已在房间中' : u.online ? '在线' : '离线' }}
                        <template v-if="u.reason"> · {{ u.reason }}</template>
                      </span>
                    </span>
                    <span class="lt-invite__check"
                      ><i
                        class="lt-icon fa-solid fa-check"
                        aria-hidden="true"
                      ></i
                    ></span>
                  </button>
                </div>
              </div>

              <div v-if="inviteGroups.length" class="lt-invite__section">
                <div class="lt-invite__label">群聊</div>
                <div class="lt-invite">
                  <button
                    v-for="g in inviteGroups"
                    :key="'group-' + g.groupId"
                    class="lt-invite__row"
                    :class="{ 'is-on': inviteGroupsSelected.includes(String(g.groupId)) }"
                    @click="toggleInviteGroup(g)"
                  >
                    <span class="lt-avatar lt-avatar--sm lt-avatar-fallback"
                      ><i
                        class="lt-icon lt-icon--sm fa-solid fa-users"
                        aria-hidden="true"
                      ></i
                    ></span>
                    <span class="lt-invite__text">
                      <span class="lt-invite__name">{{ g.name }}</span>
                      <span class="lt-invite__sub"
                        >{{ g.memberCount ? g.memberCount + ' 人' : '群聊' }}</span
                      >
                    </span>
                    <span class="lt-invite__check"
                      ><i
                        class="lt-icon fa-solid fa-check"
                        aria-hidden="true"
                      ></i
                    ></span>
                  </button>
                </div>
              </div>

              <div
                v-if="!inviteUsers.length && !inviteGroups.length"
                class="lt-empty"
              >
                <div class="lt-empty__art">
                  <i
                    class="lt-icon fa-solid fa-user-plus"
                    aria-hidden="true"
                  ></i>
                </div>
                <div class="lt-empty__title">没有可邀请的候选</div>
                <div>可以直接复制分享链接发给好友</div>
              </div>
            </template>
          </div>

          <div class="lt-modal__foot">
            <button class="lt-btn lt-btn--ghost" @click="inviteOpen = false">
              取消
            </button>
            <button
              class="lt-btn lt-btn--primary"
              :disabled="inviteSending || (!inviteSelected.length && !inviteGroupsSelected.length)"
              @click="sendInvites"
            >
              {{ inviteSending ? '发送中…' : '发送邀请' }}
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 收藏到歌单 ================= -->
    <template id="tpl-collect">
      <div class="lt-overlay" @click.self="closeCollectSheet">
        <div class="lt-modal" role="dialog" aria-modal="true" aria-label="收藏到歌单">
          <div class="lt-modal__head">
            <div>
              <div class="lt-modal__title">收藏到歌单</div>
              <div class="lt-hint">选择我创建或收藏的歌单</div>
            </div>
            <button class="lt-close" aria-label="关闭" @click="closeCollectSheet">
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>

          <div class="lt-modal__body">
            <div v-if="collectSong" class="lt-picked">
              <img
                v-if="collectSong.cover"
                :src="img(collectSong.cover, 128)"
                alt=""
              />
              <div class="lt-picked__text">
                <div class="lt-picked__name">{{ collectSong.name }}</div>
                <div class="lt-picked__artist">{{ collectSong.artist }}</div>
              </div>
              <span class="lt-chip is-accent">当前歌曲</span>
            </div>

            <div v-if="collectError" class="lt-picker__hint is-error">
              {{ collectError }}
            </div>

            <div v-if="myPlaylistsLoading && !myPlaylists.length" class="lt-picker__hint">
              <i class="lt-icon fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
              正在读取歌单…
            </div>
            <div v-else-if="myPlaylistsError" class="lt-picker__hint is-error">
              {{ myPlaylistsError }}
              <button class="lt-btn lt-btn--sm" @click="loadMyPlaylists(true)">重试</button>
            </div>

            <button
              v-for="playlist in myPlaylists"
              :key="'collect-' + playlist.id"
              class="lt-invite__row"
              :disabled="collectLoading"
              @click="addSongToPlaylist(collectSong, playlist)"
            >
              <img
                v-if="playlist.cover"
                :src="img(playlist.cover, 96)"
                class="lt-track__cover"
                alt=""
              />
              <span class="lt-invite__text">
                <span class="lt-invite__name">{{ playlist.name }}</span>
                <span class="lt-invite__sub">
                  {{ playlist.trackCount }} 首 ·
                  {{ playlist.subscribed ? '我收藏的' : '我创建的' }}
                </span>
              </span>
              <i
                class="lt-icon fa-solid"
                :class="collectLoading ? 'fa-spinner fa-spin' : 'fa-plus'"
                aria-hidden="true"
              ></i>
            </button>

            <div
              v-if="!myPlaylistsLoading && !myPlaylistsError && !myPlaylists.length"
              class="lt-empty"
            >
              <div class="lt-empty__art">
                <i class="lt-icon fa-solid fa-list-ul" aria-hidden="true"></i>
              </div>
              <div class="lt-empty__title">还没有歌单</div>
            </div>
          </div>

          <div class="lt-modal__foot">
            <button class="lt-btn lt-btn--ghost" @click="closeCollectSheet">关闭</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 设置 ================= -->
    <template id="tpl-settings">
      <div class="lt-overlay" @click.self="settingsOpen = false">
        <div class="lt-modal" role="dialog" aria-modal="true" aria-label="设置">
          <div class="lt-modal__head">
            <div class="lt-modal__title">设置</div>
            <button
              class="lt-close"
              aria-label="关闭"
              @click="settingsOpen = false"
            >
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="lt-modal__body">
            <div class="lt-field">
              <span class="lt-field__label">外观</span>
              <div class="lt-tabs">
                <button
                  class="lt-tab"
                  :class="{ 'is-active': theme === 'auto' }"
                  @click="setTheme('auto')"
                >
                  跟随系统
                </button>
                <button
                  class="lt-tab"
                  :class="{ 'is-active': theme === 'dark' }"
                  @click="setTheme('dark')"
                >
                  深色
                </button>
                <button
                  class="lt-tab"
                  :class="{ 'is-active': theme === 'light' }"
                  @click="setTheme('light')"
                >
                  浅色
                </button>
              </div>
            </div>

            <div class="lt-field">
              <span class="lt-field__label">默认音质</span>
              <select
                class="lt-select"
                v-model="audioLevel"
                @change="onLevelChange"
              >
                <option v-for="l in audioLevels" :key="l.key" :value="l.key">
                  {{ l.label }}
                </option>
              </select>
              <span class="lt-field__hint"
                >不可用时自动降级，并显示实际音质</span
              >
            </div>

            <div class="lt-field">
              <span class="lt-field__label">诊断</span>
              <div class="lt-roominfo__actions">
                <button
                  class="lt-btn lt-btn--sm"
                  @click="settingsOpen = false; debugOpen = true"
                >
                  打开调试面板
                </button>
                <button class="lt-btn lt-btn--sm" @click="exportDiagnostics">
                  <i
                    class="lt-icon lt-icon--sm fa-solid fa-download"
                    aria-hidden="true"
                  ></i
                  >导出诊断 JSON
                </button>
              </div>
            </div>

            <div class="lt-divider"></div>
            <p class="lt-hint">
              数据来自 api-enhanced
              的多人一起听接口。界面为纯静态页面，不需要构建。
            </p>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 调试 ================= -->
    <template id="tpl-debug">
      <div class="lt-overlay" @click.self="debugOpen = false">
        <div
          class="lt-modal lt-modal--wide"
          role="dialog"
          aria-modal="true"
          aria-label="调试面板"
        >
          <div class="lt-modal__head">
            <div class="lt-modal__title">调试与诊断</div>
            <button
              class="lt-close"
              aria-label="关闭"
              @click="debugOpen = false"
            >
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="lt-modal__body">
            <div class="lt-roominfo__row">
              <span
                class="lt-chip"
                :class="'is-' + (syncState === 'live' ? 'ok' : syncState === 'offline' ? 'warn' : 'info')"
                >同步 {{ syncLabel }}</span
              >
              <span class="lt-chip">SSE {{ sync.sse }}</span>
              <span class="lt-chip"
                >IM {{ imConnected ? '已连接' : imConnecting ? '连接中' : '未连接' }}</span
              >
              <span class="lt-chip"
                >音频 {{ playingInfo.actualLevel || '未加载' }}</span
              >
            </div>
            <div class="lt-roominfo__row">
              <span class="lt-roominfo__label">Room</span>
              <span class="lt-roominfo__value"
                >{{ roomInfo.roomId || '—' }}</span
              >
              <span class="lt-roominfo__label">Chat</span>
              <span class="lt-roominfo__value"
                >{{ roomInfo.chatRoomId || '—' }}</span
              >
            </div>
            <div class="lt-roominfo__row">
              <span class="lt-roominfo__label">Song</span>
              <span class="lt-roominfo__value"
                >{{ playingInfo.songId || '—' }}</span
              >
              <span class="lt-roominfo__label">Biz</span>
              <span class="lt-roominfo__value"
                >{{ playingInfo.bizId || '—' }}</span
              >
              <span class="lt-roominfo__label">Version</span>
              <span class="lt-roominfo__value"
                >{{ playingInfo.version || '—' }}</span
              >
            </div>
            <div class="lt-roominfo__actions">
              <button class="lt-btn lt-btn--sm" @click="exportDiagnostics">
                导出诊断 JSON
              </button>
              <button class="lt-btn lt-btn--sm" @click="forceExitAndReset">
                强制重置本地状态
              </button>
              <button class="lt-btn lt-btn--sm" @click="clearLogs">
                清空日志
              </button>
            </div>

            <div
              id="debugLogList"
              class="lt-logs"
              style="
                max-height: 260px;
                border: 1px solid var(--lt-line);
                border-radius: var(--lt-r-sm);
                padding: 8px;
              "
            >
              <div
                v-for="(entry, li) in logEntries"
                :key="'dbg-' + li"
                class="lt-log"
              >
                <span class="lt-log__time">{{ logTime(entry.time) }}</span>
                <span class="lt-log__tag">{{ entry.tag }}</span>
                <span class="lt-log__msg"
                  >{{ entry.msg }}<span v-if="entry.data" class="lt-log__data"
                    >{{ entry.data }}</span
                  ></span
                >
              </div>
              <div v-if="!logEntries.length" class="lt-empty">
                <div class="lt-empty__title">暂无日志</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 邀请落地页 ================= -->
    <template id="tpl-landing">
      <div class="lt-overlay" @click.self="dismissLanding">
        <div
          class="lt-modal"
          role="dialog"
          aria-modal="true"
          aria-label="加入房间"
        >
          <div class="lt-modal__head">
            <div class="lt-modal__title">邀请你一起听</div>
            <button class="lt-close" aria-label="关闭" @click="dismissLanding">
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="lt-modal__body">
            <div class="lt-picked">
              <img
                v-if="landingInfo.inviterAvatar"
                :src="img(landingInfo.inviterAvatar, 96)"
                alt=""
              />
              <div class="lt-picked__text">
                <div class="lt-picked__name">
                  {{ landingInfo.inviterName || '好友' }} 邀请你加入
                </div>
                <div class="lt-picked__artist">
                  {{ landingInfo.roomTypeLabel || '一起听房间' }}
                </div>
              </div>
            </div>

            <div v-if="landingInfo.songName" class="lt-picked">
              <img
                v-if="landingInfo.songCover"
                :src="img(landingInfo.songCover, 128)"
                alt=""
              />
              <div class="lt-picked__text">
                <div class="lt-picked__name">{{ landingInfo.songName }}</div>
                <div class="lt-picked__artist">
                  {{ landingInfo.songArtist }}
                </div>
              </div>
            </div>

            <div
              v-if="landingInfo.roomStatus && landingInfo.roomStatus !== 'AVAILABLE'"
              class="lt-picker__hint is-error"
            >
              房间已结束或不可加入
            </div>

            <div class="lt-roominfo__row">
              <span class="lt-roominfo__label">房间</span>
              <span class="lt-roominfo__value">{{ landingInfo.roomId }}</span>
              <span class="lt-roominfo__label">成员</span>
              <span class="lt-roominfo__value"
                >{{ landingInfo.members }} 人</span
              >
            </div>

            <div v-if="landingInfo.memberList.length" class="lt-invite">
              <div
                v-for="(m, mi) in landingInfo.memberList.slice(0, 6)"
                :key="'lm-' + mi"
                class="lt-invite__row"
                style="cursor: default"
              >
                <img
                  v-if="m.avatar"
                  :src="img(m.avatar, 96)"
                  class="lt-avatar lt-avatar--sm"
                  alt=""
                />
                <span v-else class="lt-avatar lt-avatar--sm lt-avatar-fallback"
                  >{{ initialOf(m.nickname) }}</span
                >
                <span class="lt-invite__text"
                  ><span class="lt-invite__name">{{ m.nickname }}</span></span
                >
              </div>
            </div>
          </div>
          <div class="lt-modal__foot">
            <button class="lt-btn lt-btn--ghost" @click="dismissLanding">
              取消
            </button>
            <button
              class="lt-btn lt-btn--primary"
              :disabled="
                landingInfo.roomStatus &&
                landingInfo.roomStatus !== 'AVAILABLE'
              "
              @click="joinLandingRoom"
            >
              加入房间
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 成员抽屉 ================= -->
    <template id="tpl-members-drawer">
      <div class="lt-overlay" @click.self="membersOpen = false">
        <div
          class="lt-drawer"
          role="dialog"
          aria-modal="true"
          aria-label="在线成员"
        >
          <div class="lt-colhead">
            <div class="lt-colhead__title">
              在线成员 <small>{{ roomInfo.roomUsers.length }}</small>
            </div>
            <button
              class="lt-close"
              aria-label="关闭"
              @click="membersOpen = false"
            >
              <i class="lt-icon fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <lt-members flat></lt-members>
        </div>
      </div>
    </template>

    <!-- ================= Toast ================= -->
    <template id="tpl-toasts">
      <div class="lt-toast-host" aria-live="polite">
        <div
          v-for="toast in toasts"
          :key="toast.id"
          class="lt-toast"
          :class="'is-' + toast.type"
        >
          <span class="lt-toast__dot"></span>
          <span class="lt-toast__text">{{ toast.text }}</span>
        </div>
      </div>
    </template>

    <script data-cfasync="false" src="/listen_together_multi/js/boot.js?v=88"></script>
  </body>
</html>
